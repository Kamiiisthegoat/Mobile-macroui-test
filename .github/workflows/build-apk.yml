name: Build MacroExecutor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21' # Fix #3: Capacitor requires Java 21

    - name: Install npm dependencies
      run: |
        npm install --legacy-peer-deps # Fix #2: Peer dependency conflict
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

    - name: Build Web Assets
      run: npm run build

    - name: Preserve Custom Android Source
      run: |
        mkdir -p /tmp/custom_src
        cp -r android/app/src/main/* /tmp/custom_src/ || true

    - name: Generate Fresh Capacitor Android Project
      run: |
        rm -rf android
        npx cap add android
        # Fix #1: Restore custom files
        cp -r /tmp/custom_src/* android/app/src/main/

    - name: Inject Kotlin BOM & Dependencies
      run: |
        # Fix #4: Duplicate class fix via Kotlin BOM
        cat << 'EOF' >> android/app/build.gradle
        
        dependencies {
            implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.9.22"))
            implementation 'io.github.taoweiji.quickjs:quickjs-android:1.4.6'
            // Add any other custom dependencies here
        }
        EOF

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Make Gradlew Executable
      run: chmod +x android/gradlew

    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MacroExecutor-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk 
