name: Build MacroExecutor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Vite web app
        run: npm run build

      - name: Backup custom native sources
        run: |
          if [ -d android/app/src/main ]; then
            mkdir -p /tmp/custom-main
            cp -R android/app/src/main/. /tmp/custom-main/
            echo "Backed up custom main sources."
          fi

      - name: Remove placeholder android directory
        run: rm -rf android

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Restore custom native sources
        run: |
          if [ -d /tmp/custom-main ]; then
            cp -R /tmp/custom-main/. android/app/src/main/
            echo "Custom native sources restored."
          fi

      - name: Ensure strings.xml has accessibility_description
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          mkdir -p "$(dirname "$STRINGS")"
          if [ -f "$STRINGS" ]; then
            if ! grep -q 'accessibility_description' "$STRINGS"; then
              sed -i '/<\/resources>/i\    <string name="accessibility_description">MacroExecutor uses the Accessibility Service to replay taps and swipes.</string>' "$STRINGS"
            fi
          else
            cat > "$STRINGS" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MacroExecutor</string>
              <string name="title_activity_main">MacroExecutor</string>
              <string name="accessibility_description">MacroExecutor uses the Accessibility Service to replay taps and swipes.</string>
          </resources>
          EOF
          fi

      # ── 1. Patch Root Gradle & Memory Settings ──
      - name: Patch root Gradle and memory settings
        run: |
          python3 - << 'PY'
          import re, os

          # 1. Increase Gradle Daemon Memory
          prop_path = 'android/gradle.properties'
          os.makedirs(os.path.dirname(prop_path), exist_ok=True)
          with open(prop_path, 'a') as f:
              f.write('\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n')
          print("Added Gradle JVM args for memory.")

          # 2. Add Kotlin Plugin classpath to root build.gradle
          root_gradle = 'android/build.gradle'
          with open(root_gradle, 'r') as f:
              content = f.read()
          
          if 'kotlin-gradle-plugin' not in content:
              # Standard Capacitor 7 build.gradle uses buildscript dependencies
              match = re.search(r'dependencies\s*\{', content)
              if match:
                  insert_pos = match.end()
                  dep = '\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"\n'
                  content = content[:insert_pos] + dep + content[insert_pos:]
                  with open(root_gradle, 'w') as f:
                      f.write(content)
                  print("Injected Kotlin Gradle Plugin into root build.gradle.")
          PY

      # ── 2. Patch App Gradle ──
      - name: Patch app Gradle build files
        run: |
          python3 - << 'PY'
          import re, sys

          file_path = 'android/app/build.gradle'
          with open(file_path, 'r') as f:
              content = f.read()

          # Apply Kotlin plugin
          if 'kotlin-android' not in content:
              content = content.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'")
              print("Applied kotlin-android plugin.")

          # Inject NDK and CMake
          if 'ndkVersion' not in content:
              match = re.search(r'android\s*\{', content)
              if match:
                  insert_pos = match.end()
                  config = '\n    ndkVersion "25.1.8937393"\n    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n            version "3.22.1"\n        }\n    }\n'
                  content = content[:insert_pos] + config + content[insert_pos:]
                  print("Injected NDK and CMake configuration.")

          # Inject dependencies and resolutionStrategy
          if 'kotlin-bom' not in content:
              match = re.search(r'dependencies\s*\{', content)
              if match:
                  insert_pos = match.end()
                  deps = '\n    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.22")\n    implementation "org.jetbrains.kotlin:kotlin-stdlib"\n    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"\n    implementation "io.github.taoweiji.quickjs:quickjs-android:1.4.6"\n'
                  content = content[:insert_pos] + deps + content[insert_pos:]
                  print("Injected dependencies.")

          # Force Kotlin stdlib alignment
          if 'resolutionStrategy' not in content:
              match = re.search(r'dependencies\s*\{', content)
              if match:
                  insert_pos = match.end()
                  strategy = '\n    configurations.all {\n        resolutionStrategy {\n            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"\n            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"\n        }\n    }\n'
                  content = content[:insert_pos] + strategy + content[insert_pos:]
                  print("Injected Kotlin stdlib resolutionStrategy.")

          with open(file_path, 'w') as f:
              f.write(content)
          print("Successfully patched app/build.gradle")
          PY

      # ── 3. Compile with Log Capture ──
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info > gradle-build.log 2>&1 || { 
            echo "❌ BUILD FAILED"; 
            tail -n 200 gradle-build.log; 
            exit 1; 
          }

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MacroExecutor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Gradle Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          retention-days: 3
