name: Build MacroExecutor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Setup Node.js (cache removed to prevent lockfile error) ──
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 2. Install dependencies (legacy-peer-deps required) ──
      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      # ── 3. Build Vite frontend ──────────────────────────────
      - name: Build Vite web app
        run: npm run build

      # ── 4. Back up custom android/app/src/main ─────────────
      - name: Backup custom native sources
        run: |
          if [ -d android/app/src/main ]; then
            mkdir -p /tmp/custom-main
            cp -R android/app/src/main/. /tmp/custom-main/
            echo "Backed up custom main sources."
          else
            echo "No pre-existing android/app/src/main found, nothing to backup."
          fi

      # ── 5. Remove placeholder android/ so cap add generates fresh ──
      - name: Remove placeholder android directory
        run: rm -rf android

      # ── 6. Generate a valid Capacitor Android project ──────
      - name: Add Capacitor Android platform
        run: npx cap add android

      # ── 7. Restore custom files (overwrite Capacitor defaults) ──
      - name: Restore custom native sources
        run: |
          if [ -d /tmp/custom-main ]; then
            cp -R /tmp/custom-main/. android/app/src/main/
            echo "Custom native sources restored."
          fi

      # ── 8. Ensure strings.xml contains accessibility_description ──
      - name: Ensure strings.xml has accessibility_description
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          mkdir -p "$(dirname "$STRINGS")"
          if [ -f "$STRINGS" ]; then
            if ! grep -q 'accessibility_description' "$STRINGS"; then
              sed -i '/<\/resources>/i\    <string name="accessibility_description">MacroExecutor uses the Accessibility Service to replay taps and swipes.</string>' "$STRINGS"
            fi
          else
            cat > "$STRINGS" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MacroExecutor</string>
              <string name="title_activity_main">MacroExecutor</string>
              <string name="accessibility_description">MacroExecutor uses the Accessibility Service to replay taps and swipes.</string>
          </resources>
          EOF
          fi

      # ── 9. Inject Gradle init script (Kotlin BOM / NDK / QuickJS) ──
      - name: Write Gradle init script
        run: |
          mkdir -p /tmp/gradle-init
          cat > /tmp/gradle-init/inject.gradle << 'GRADLE_EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.name == 'app' && project.plugins.hasPlugin('com.android.application')) {
                      // Kotlin Android plugin
                      if (!project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
                          project.apply plugin: 'org.jetbrains.kotlin.android'
                      }

                      // NDK + CMake
                      project.android.ndkVersion = "25.1.8937393"
                      project.android.externalNativeBuild {
                          cmake {
                              path = project.file("src/main/cpp/CMakeLists.txt")
                              version = "3.22.1"
                          }
                      }

                      // Kotlin BOM: prevents kotlin-stdlib vs kotlin-stdlib-jdk8 duplicate classes
                      project.dependencies {
                          implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.22")
                          implementation "org.jetbrains.kotlin:kotlin-stdlib"
                          implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
                          implementation "io.github.taoweiji.quickjs:quickjs-android:1.4.6"
                      }
                  }
              }
          }
          GRADLE_EOF

      # ── 10. Compile Debug APK ────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --init-script /tmp/gradle-init/inject.gradle \
            --stacktrace \
            --no-daemon

      # ── 11. Upload APK artifact ─────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MacroExecutor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
