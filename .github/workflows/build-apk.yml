name: Build MacroExecutor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install npm dependencies
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/clipboard --legacy-peer-deps

    - name: Build Web Assets
      run: npm run build

    - name: Preserve Custom Android Source
      run: |
        mkdir -p /tmp/custom_src
        cp -r android/app/src/main/* /tmp/custom_src/ || true

    - name: Generate Fresh Capacitor Android Project
      run: |
        rm -rf android
        npx cap add android
        cp -r /tmp/custom_src/* android/app/src/main/

    - name: Patch Android Gradle (Kotlin + NDK + Deps)
      run: python3 .github/scripts/patch-android.py

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Make Gradlew Executable
      run: chmod +x android/gradlew

    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MacroExecutor-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
