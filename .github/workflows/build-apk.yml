name: Build MacroExecutor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Vite web app
        run: npm run build

      - name: Backup custom native sources
        run: |
          if [ -d android/app/src/main ]; then
            mkdir -p /tmp/custom-main
            cp -R android/app/src/main/. /tmp/custom-main/
            echo "Backed up custom main sources."
          fi

      - name: Remove placeholder android directory
        run: rm -rf android

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Restore custom native sources
        run: |
          if [ -d /tmp/custom-main ]; then
            cp -R /tmp/custom-main/. android/app/src/main/
            echo "Custom native sources restored."
          fi

      - name: Ensure strings.xml has accessibility_description
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          mkdir -p "$(dirname "$STRINGS")"
          if [ -f "$STRINGS" ]; then
            if ! grep -q 'accessibility_description' "$STRINGS"; then
              sed -i '/<\/resources>/i\    <string name="accessibility_description">MacroExecutor uses the Accessibility Service to replay taps and swipes.</string>' "$STRINGS"
            fi
          else
            cat > "$STRINGS" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MacroExecutor</string>
              <string name="title_activity_main">MacroExecutor</string>
              <string name="accessibility_description">MacroExecutor uses the Accessibility Service to replay taps and swipes.</string>
          </resources>
          EOF
          fi

      # ── 1. Fix QuickJsMacroRunner.kt (Corrected Syntax) ──
      - name: Patch QuickJsMacroRunner.kt
        run: |
          cat > android/app/src/main/java/com/kamii/macroexecutor/QuickJsMacroRunner.kt << 'EOF'
          package com.kamii.macroexecutor

          import android.os.SystemClock
          import io.github.taoweiji.quickjs.JSArray
          import io.github.taoweiji.quickjs.JSContext
          import io.github.taoweiji.quickjs.JSObject
          import io.github.taoweiji.quickjs.QuickJS
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          object QuickJsMacroRunner {

              @Volatile
              private var running = false

              fun isRunning(): Boolean = running

              fun stop() {
                  running = false
              }

              suspend fun execute(script: String): String = withContext(Dispatchers.Default) {
                  if (running) return@withContext "ERROR: already running"
                  running = true

                  var runtime: QuickJS? = null
                  var context: JSContext? = null

                  try {
                      runtime = QuickJS.createRuntime()
                      context = runtime.createContext()

                      val host = JSObject(context)

                      // tap(x, y, [durationMs])
                      host.registerJavaMethod({ _, args ->
                          val x = args.getDouble(0).toFloat()
                          val y = args.getDouble(1).toFloat()
                          val d = if (args.length() > 2) args.getLong(2) else 50L
                          MacroAccessibilityService.instance?.performTap(x, y, d) ?: false
                      }, "tap")

                      // swipe(x1, y1, x2, y2, durationMs)
                      host.registerJavaMethod({ _, args ->
                          MacroAccessibilityService.instance?.performSwipe(
                              args.getDouble(0).toFloat(),
                              args.getDouble(1).toFloat(),
                              args.getDouble(2).toFloat(),
                              args.getDouble(3).toFloat(),
                              args.getLong(4)
                          ) ?: false
                      }, "swipe")

                      // sleep(ms)
                      host.registerJavaMethod({ _, args ->
                          val ms = args.getLong(0)
                          var remaining = ms
                          while (remaining > 0 && running) {
                              val chunk = minOf(remaining, 50L)
                              SystemClock.sleep(chunk)
                              remaining -= chunk
                          }
                          running
                      }, "sleep")

                      // getPixel(x, y) -> ARGB jint
                      host.registerJavaMethod({ _, args ->
                          val reader = ScreenCaptureHolder.imageReader ?: return 0
                          val image = reader.acquireLatestImage() ?: return 0
                          try {
                              val plane = image.planes[0]
                              NativePixelEngine.getPixelColor(
                                  plane.buffer,
                                  image.width,
                                  image.height,
                                  plane.rowStride,
                                  args.getInteger(0),
                                  args.getInteger(1)
                              )
                          } finally {
                              image.close()
                          }
                      }, "getPixel")

                      // matchPixels(tripletsFlatArray, tolerance) -> Boolean
                      host.registerJavaMethod({ _, args ->
                          val reader = ScreenCaptureHolder.imageReader ?: return false
                          val image = reader.acquireLatestImage() ?: return false
                          try {
                              val plane = image.planes[0]
                              val jsArray = args.get(0) as? JSArray ?: return false
                              val len = jsArray.length()
                              val triplets = IntArray(len) { i ->
                                  jsArray.getInteger(i)
                              }
                              val tolerance = args.getInteger(1)
                              NativePixelEngine.matchMultiPixels(
                                  plane.buffer,
                                  image.width,
                                  image.height,
                                  plane.rowStride,
                                  triplets,
                                  tolerance
                              )
                          } finally {
                              image.close()
                          }
                      }, "matchPixels")

                      // findColor(x1, y1, x2, y2, argbColor, tolerance) -> packed (x<<16)|y, or -1
                      host.registerJavaMethod({ _, args ->
                          val reader = ScreenCaptureHolder.imageReader ?: return -1
                          val image = reader.acquireLatestImage() ?: return -1
                          try {
                              val plane = image.planes[0]
                              NativePixelEngine.findColorInRegion(
                                  plane.buffer,
                                  image.width,
                                  image.height,
                                  plane.rowStride,
                                  args.getInteger(0),
                                  args.getInteger(1),
                                  args.getInteger(2),
                                  args.getInteger(3),
                                  args.getInteger(4),
                                  args.getInteger(5)
                              )
                          } finally {
                              image.close()
                          }
                      }, "findColor")

                      context.set("MacroHost", host)
                      context.executeVoidScript(script, "macro.js")
                      "OK"
                  } catch (t: Throwable) {
                      "ERROR: ${t.javaClass.simpleName}: ${t.message}"
                  } finally {
                      runCatching { context?.close() }
                      runCatching { runtime?.close() }
                      running = false
                  }
              }
          }
          EOF
          echo "Patched QuickJsMacroRunner.kt with corrected syntax."

      # ── 2. Patch Gradle Memory Settings (OOM FIX) ──
      - name: Configure Gradle Memory Limits
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC
          kotlin.compiler.execution.strategy=in-process
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          echo "Configured Gradle to run Kotlin compiler in-process with 6GB heap."

      # ── 3. Patch Root Gradle for Kotlin Plugin ──
      - name: Patch root Gradle file
        run: |
          python3 - << 'PY'
          import re
          root_gradle = 'android/build.gradle'
          with open(root_gradle, 'r') as f:
              content = f.read()
          
          if 'kotlin-gradle-plugin' not in content:
              match = re.search(r'dependencies\s*\{', content)
              if match:
                  insert_pos = match.end()
                  dep = '\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"\n'
                  content = content[:insert_pos] + dep + content[insert_pos:]
                  with open(root_gradle, 'w') as f:
                      f.write(content)
                  print("Injected Kotlin Gradle Plugin into root build.gradle.")
          PY

      # ── 4. Patch App Gradle for NDK, CMake, and Dependencies ──
      - name: Patch app Gradle build files
        run: |
          python3 - << 'PY'
          import re, sys

          file_path = 'android/app/build.gradle'
          with open(file_path, 'r') as f:
              content = f.read()

          if 'kotlin-android' not in content:
              content = content.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'")

          if 'ndkVersion' not in content:
              match = re.search(r'android\s*\{', content)
              if match:
                  insert_pos = match.end()
                  config = '\n    ndkVersion "25.1.8937393"\n    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n            version "3.22.1"\n        }\n    }\n'
                  content = content[:insert_pos] + config + content[insert_pos:]

          if 'kotlin-bom' not in content:
              match = re.search(r'dependencies\s*\{', content)
              if match:
                  insert_pos = match.end()
                  deps = '\n    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.22")\n    implementation "org.jetbrains.kotlin:kotlin-stdlib"\n    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"\n    implementation "io.github.taoweiji.quickjs:quickjs-android:1.4.6"\n'
                  content = content[:insert_pos] + deps + content[insert_pos:]

          if 'resolutionStrategy' not in content:
              match = re.search(r'dependencies\s*\{', content)
              if match:
                  insert_pos = match.end()
                  strategy = '\n    configurations.all {\n        resolutionStrategy {\n            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"\n            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"\n        }\n    }\n'
                  content = content[:insert_pos] + strategy + content[insert_pos:]

          with open(file_path, 'w') as f:
              f.write(content)
          print("Successfully patched app/build.gradle")
          PY

      # ── 5. Compile with Log Capture ──
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info > gradle-build.log 2>&1 || { 
            echo "❌ BUILD FAILED"; 
            tail -n 200 gradle-build.log; 
            exit 1; 
          }

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MacroExecutor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Gradle Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          retention-days: 3 
